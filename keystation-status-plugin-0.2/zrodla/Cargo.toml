[package]
name = "keystation_status"
version = "0.2.0"
edition = "2021"
description = "Live state of the Keystation Pro 88 router, shown inside the DAW"

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
