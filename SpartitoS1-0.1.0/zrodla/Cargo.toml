[package]
name = "spartito_s1"
version = "0.1.0"
edition = "2021"
description = "Spartito for Studio One: the notes you play, as a score, inside the DAW"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
nih_plug_egui = { path = "vendor/nih_plug_egui" }
rquickjs = { version = "0.14", features = ["parallel"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rtrb = "0.3"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3

