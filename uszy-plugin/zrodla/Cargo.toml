[package]
name = "uszy"
version = "0.1.0"
edition = "2021"
description = "Ears for the AI: loudness meter + gain trim, readable and settable through files"

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
